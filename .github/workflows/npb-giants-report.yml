name: NPB 巨人戦 批評レポート

on:
  schedule:
    - cron: '30 13 * * *'  # 毎日22:30 JST（UTC+9 → UTC 13:30）
  workflow_dispatch:
    inputs:
      date:
        description: '対象日（省略で昨日）例: 20260422'
        required: false

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Node.js セットアップ
        uses: actions/setup-node@v4.3.0
        with:
          node-version: '22'

      - name: 依存関係インストール
        run: cd npb-reporter && npm install

      - name: NPB巨人戦レポート生成・X投稿
        env:
          ANTHROPIC_API_KEY:     ${{ secrets.ANTHROPIC_API_KEY }}
          X_CONSUMER_KEY:        ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_SECRET:     ${{ secrets.X_CONSUMER_SECRET }}
          X_ACCESS_TOKEN:        ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            cd npb-reporter && node npb-report.mjs --team 巨人 --date ${{ github.event.inputs.date }}
          else
            cd npb-reporter && node npb-report.mjs --team 巨人
          fi

      - name: 生成ファイルをコミット・プッシュ
        if: always()
        run: |
          git config user.name "npb-reporter-bot"
          git config user.email "bot@saeki-ryo-company"
          git add npb-reporter/data/ || true
          git diff --staged --quiet || git commit -m "NPB巨人戦レポート $(TZ=Asia/Tokyo date +'%Y-%m-%d')"
          git push || true
