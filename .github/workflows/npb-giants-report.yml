name: NPB 巨人戦 批評レポート

on:
  # 一時停止中：試合途中に誤って投稿されるバグがあるため無効化（2026-08-09）
  # schedule:
  #   - cron: '*/15 7-14 * * *'  # 16:00〜23:30 JST（UTC 7:00〜14:30）15分おきに試合完了を確認
  workflow_dispatch:
    inputs:
      date:
        description: '対象日（省略で昨日）例: 20260422'
        required: false

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Node.js セットアップ
        uses: actions/setup-node@v4.3.0
        with:
          node-version: '22'

      - name: 依存関係インストール
        run: cd npb-reporter && npm install

      - name: NPB巨人戦レポート生成・自己検証・X投稿（リトライあり）
        env:
          ANTHROPIC_API_KEY:     ${{ secrets.ANTHROPIC_API_KEY }}
          X_CONSUMER_KEY:        ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_SECRET:     ${{ secrets.X_CONSUMER_SECRET }}
          X_ACCESS_TOKEN:        ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          DATE_ARG=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            DATE_ARG="--date ${{ github.event.inputs.date }}"
          fi
          for i in 1 2 3; do
            echo "=== 試行 $i / 3 ==="
            if (cd npb-reporter && node npb-report.mjs --team 巨人 $DATE_ARG); then
              exit 0
            fi
            if [ $i -lt 3 ]; then
              echo "失敗。20秒後にリトライ..."
              sleep 20
            fi
          done
          echo "❌ 3回すべて失敗"
          exit 1

      - name: 生成ファイルをコミット・プッシュ
        if: always()
        run: |
          git config user.name "npb-reporter-bot"
          git config user.email "bot@saeki-ryo-company"
          git add npb-reporter/data/ || true
          git diff --staged --quiet || git commit -m "NPB巨人戦レポート $(TZ=Asia/Tokyo date +'%Y-%m-%d')"
          git push || true
