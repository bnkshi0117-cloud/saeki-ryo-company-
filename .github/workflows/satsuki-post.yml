name: さつき Threads 自動投稿

on:
  schedule:
    - cron: '30 22 * * *'   # JST 7:30  朝の通勤
    - cron: '15 3 * * *'    # JST 12:15 昼休み
    - cron: '30 6 * * *'    # JST 15:30 午後の一息
    - cron: '30 9 * * *'    # JST 18:30 帰宅
    - cron: '30 11 * * *'   # JST 20:30 夜のリラックス
    - cron: '0 13 * * *'    # JST 22:00 就寝前（上限）
  workflow_dispatch:  # 手動実行も可能

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 依存関係インストール
        run: cd x-dashboard && npm install

      - name: 投稿キュー補充（残り3件以下の場合）
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: cd x-dashboard && node satsuki-generate.mjs

      - name: 今日の投稿数チェック（4〜5投稿に制限）
        id: check
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          COUNT=$(node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('x-dashboard/data/satsuki-posts.json'));
            const today = '$TODAY';
            const todayPosts = data.posts.filter(p =>
              p.status === 'posted' && p.posted_at && p.posted_at.startsWith(today)
            ).length;
            const dayNum = parseInt(today.replace(/-/g, ''));
            const limit = (dayNum % 2 === 0) ? 4 : 5;
            const shouldPost = todayPosts < limit;
            process.stdout.write('should_post=' + shouldPost + '\n');
          " | tail -1)
          echo "$COUNT" >> $GITHUB_OUTPUT

      - name: Threads に投稿
        if: steps.check.outputs.should_post == 'true'
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          cd x-dashboard && node satsuki-threads.mjs

      - name: 結果をコミット・プッシュ
        run: |
          git config user.name "satsuki-bot"
          git config user.email "satsuki@saeki-ryo-company"
          git add x-dashboard/data/satsuki-posts.json
          git diff --staged --quiet || git commit -m "さつき投稿記録 $(date -u +%Y-%m-%d)"
          git push
