name: 佐伯亮 X自動投稿

on:
  schedule:
    # JST 7:00  (UTC 22:00 前日)
    - cron: '0 22 * * *'
    # JST 9:00  (UTC 00:00)
    - cron: '0 0 * * *'
    # JST 11:00 (UTC 02:00)
    - cron: '0 2 * * *'
    # JST 13:00 (UTC 04:00)
    - cron: '0 4 * * *'
    # JST 15:00 (UTC 06:00)
    - cron: '0 6 * * *'
    # JST 17:00 (UTC 08:00)
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Node.js セットアップ
        uses: actions/setup-node@v4.3.0
        with:
          node-version: '22'

      - name: 依存関係インストール
        run: cd x-dashboard && npm install

      - name: 自分のツイートを最新取得（エンゲージメントデータ更新）
        continue-on-error: true
        env:
          X_CONSUMER_KEY:        ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_SECRET:     ${{ secrets.X_CONSUMER_SECRET }}
          X_ACCESS_TOKEN:        ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: cd x-dashboard && node fetch-my-tweets.mjs

      - name: 投稿内容を生成・Slack通知
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          CANCEL_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          cd x-dashboard && node auto-poster.mjs generate "$CANCEL_URL"

      - name: 1分待機（この間にSlackでNGなら上のURLからキャンセル）
        run: sleep 60

      - name: X投稿
        env:
          X_CONSUMER_KEY:        ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_SECRET:     ${{ secrets.X_CONSUMER_SECRET }}
          X_ACCESS_TOKEN:        ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          SLACK_WEBHOOK_URL:     ${{ secrets.SLACK_WEBHOOK_URL }}
        run: cd x-dashboard && node auto-poster.mjs post

      - name: ログをコミット・プッシュ
        if: always()
        run: |
          git config user.name "saeki-auto-poster"
          git config user.email "bot@saeki-ryo-company"
          git add x-dashboard/post-log.json x-dashboard/data/my-tweets.json x-dashboard/data/reference-tweets.json || true
          git diff --staged --quiet || git commit -m "佐伯亮投稿記録 $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M')"
          git push || true
